
<!DOCTYPE html>
<html>
<head>
    <title>Add To Cart</title>

    <style>
        body{
            margin:0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(120deg,#2193b0,#6dd5ed);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .cart-container{
            background:white;
            width:420px;
            padding:35px;
            border-radius:15px;
            box-shadow:0 8px 25px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        label{
            font-weight:600;
            color:#444;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:8px;
            margin-bottom:18px;
            border-radius:8px;
            border:1px solid #ccc;
            font-size:14px;
        }

        input:focus{
            outline:none;
            border-color:#2193b0;
            box-shadow:0 0 5px rgba(33,147,176,0.5);
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            background:linear-gradient(120deg,#2193b0,#6dd5ed);
            color:white;
            font-size:16px;
            border-radius:10px;
            cursor:pointer;
            font-weight:bold;
        }

        button:hover{
            opacity:0.9;
        }
    </style>
</head>

<body>

<div class="cart-container">
    <h2>Add Product To Cart</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Product Name</label>
        <input type="text" name="product_name" required>

        <label>Quantity</label>
        <input type="number" name="quantity" required>

        <label>Price</label>
        <input type="number" name="price" required>

        <button type="submit">Add To Cart</button>
    </form>
</div>

</body>
</html>
