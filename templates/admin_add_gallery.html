<!DOCTYPE html>
<html>
<head>
    <title>Admin Add Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 450px;
            width: 90%;
            margin: 60px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            font-weight: bold;
            color: #444;
        }

        input[type="text"],
        textarea,
        input[type="file"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            resize: none;
            height: 80px;
        }

        button {
            width: 100%;
            background: #0d6efd;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0b5ed7;
        }

        hr {
            margin: 40px 0 20px;
        }

        .table-responsive {
            width: 95%;
            margin: auto;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #0d6efd;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }

        img {
            border-radius: 6px;
        }

        .no-record {
            text-align: center;
            color: red;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Admin - Add Gallery Image</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Title</label>
        <input type="text" name="title" required>

        <label>Description</label>
        <textarea name="description"></textarea>

        <label>Upload Image</label>
        <input type="file" name="image" required>

        <button type="submit">Upload Gallery</button>
    </form>
</div>

<hr>
<h2 style="text-align:center;">Manage Gallery</h2>

<div class="table-responsive">
<table>
    <tr>
        <th>ID</th>
        <th>Product Name</th>
        <th>Description</th>
        <th>Image</th>
        <th>Action</th>
    </tr>

    {% if gallery_items %}
        {% for item in gallery_items %}
        <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.Name }}</td>
            <td>{{ item.Descrption }}</td>
            <td><img src="{{ item.Image.url }}" width="80" height="80"></td>
            <td>
                <a href="{% url 'admin_delete_gallery' item.id %}" onclick="return confirm('Are you sure you want to delete this image?');" style="color: red; text-decoration: none; font-weight: bold;">❌ Delete</a>
            </td>
        </tr>
        {% endfor %}
    {% else %}
        <tr>
            <td colspan="5" class="no-record">No Records Found</td>
        </tr>
    {% endif %}

</table>
</div>

</body>
</html>
