<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Delete Product — ElectroMart Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'DM Sans',sans-serif; background:#f1f5f9; min-height:100vh; display:flex; align-items:center; justify-content:center; }
.modal { background:#fff; border-radius:20px; padding:40px; max-width:440px; width:90%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.12); }
.icon { font-size:3rem; color:#ef4444; margin-bottom:16px; }
h2 { font-family:'Space Grotesk',sans-serif; font-size:1.4rem; font-weight:700; margin-bottom:8px; }
p { color:#64748b; font-size:0.9rem; margin-bottom:28px; line-height:1.6; }
.product-name { color:#0f172a; font-weight:700; }
.actions { display:flex; gap:12px; justify-content:center; }
.btn { display:inline-flex; align-items:center; gap:8px; padding:11px 24px; border-radius:10px; font-size:0.875rem; font-weight:600; border:none; cursor:pointer; transition:all 0.15s; text-decoration:none; }
.btn-cancel { background:#f1f5f9; color:#475569; }
.btn-cancel:hover { background:#e2e8f0; }
.btn-delete { background:#ef4444; color:#fff; }
.btn-delete:hover { background:#dc2626; transform:translateY(-1px); }
</style>
</head>
<body>
<div class="modal">
  <div class="icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
  <h2>Delete Product?</h2>
  <p>You're about to permanently delete<br><span class="product-name">{{ product.Product_Name }}</span>.<br>This action cannot be undone.</p>
  <div class="actions">
    <a href="{% url 'dashboard' %}" class="btn btn-cancel"><i class="fa-solid fa-xmark"></i> Cancel</a>
    <form method="POST" style="display:inline;">
      {% csrf_token %}
      <button type="submit" class="btn btn-delete"><i class="fa-solid fa-trash"></i> Delete Permanently</button>
    </form>
  </div>
</div>
</body>
</html>
