{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | Dhara Enterprise</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Professional Theme Colors */
            --primary: #4f46e5;      /* Electric Indigo */
            --primary-hover: #4338ca;
            --dark: #111827;         /* Deep Midnight */
            --bg: #f3f4f6;           /* Soft Application Gray */
            --card: #ffffff;
            --text-main: #374151;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --success-green: #10b981; /* Emerald Green for Success */
            --shadow-lg: 0 20px 40px -10px rgba(0,0,0,0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Decorative Background Banner */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%;
            height: 350px;
            background: linear-gradient(135deg, #1e1b4b 0%, #4f46e5 100%);
            z-index: -1;
        }

        /* =========================================
           NAVBAR (Matched to your site)
           ========================================= */
        .header-nav {
            position: fixed;
            top: 0; width: 100%; height: 80px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 5%;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            z-index: 1000;
        }

        .nav-logo-img { height: 50px; transition: var(--transition); }
        .nav-logo-img:hover { transform: scale(1.05); }

        .nav-links { display: flex; align-items: center; }
        .nav-links a {
            text-decoration: none; margin-left: 25px;
            color: var(--dark); font-weight: 600; font-size: 0.95rem;
            transition: var(--transition);
        }
        .nav-links a:hover { color: var(--primary); }

        .login-btn {
            background: var(--dark) !important; color: #fff !important;
            padding: 10px 24px; border-radius: 10px; font-weight: 600 !important;
        }
        .login-btn:hover {
            background: var(--primary) !important; transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        /* =========================================
           FEEDBACK FORM STYLES
           ========================================= */
        .feedback-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 140px 5% 60px; /* Space for fixed navbar and top banner */
        }

        .feedback-card {
            background: var(--card);
            width: 100%;
            max-width: 550px;
            padding: 50px;
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255,255,255,0.8);
            animation: fadeUp 0.6s ease-out backwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .feedback-header .icon-box {
            width: 60px; height: 60px;
            background: #e0e7ff; color: var(--primary);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; margin: 0 auto 15px;
        }

        .feedback-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--dark);
            margin-bottom: 5px;
        }

        .feedback-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Input Fields */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 15px;
            color: #9ca3af;
            font-size: 1rem;
        }

        .input-wrapper input,
        .input-wrapper textarea {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #f9fafb;
            font-size: 0.95rem;
            color: var(--text-main);
            font-weight: 500;
            transition: var(--transition);
            outline: none;
        }

        .input-wrapper textarea {
            resize: none;
            height: 140px;
            line-height: 1.5;
        }

        .input-wrapper input:focus,
        .input-wrapper textarea:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        /* Submit Button & Animation States */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .submit-btn:hover:not(.is-loading):not(.is-success) {
            background: var(--primary-hover);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }

        .submit-btn.is-loading {
            background: var(--dark);
            pointer-events: none;
            box-shadow: 0 10px 20px rgba(17, 24, 39, 0.2);
        }

        .submit-btn.is-success {
            background: var(--success-green);
            pointer-events: none;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links a:not(.login-btn) { display: none; }
            .feedback-card { padding: 40px 25px; }
            .feedback-header h2 { font-size: 1.8rem; }
            body::before { height: 280px; }
        }
    </style>
</head>

<body>

<nav class="header-nav">
    <a href="/" class="logo-link">
        <img src="{% static 'logo.jpeg' %}" class="nav-logo-img" alt="Dhara Enterprise">
    </a>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="{% url 'about1' %}">About Us</a>
        <a href="/product/">Products</a>
        <a href="/contact/">Contact</a>
        <a href="/feedback/" style="color: var(--primary);">Feedback</a>
        
        {% if user.is_authenticated %}
            <a href="/profile/" class="login-btn">{{ user.username }}</a>
        <a href="/logout/" class="login-btn">Logout</a>
        {% else %}
            <a href="/login/" class="login-btn">Login</a>
        {% endif %}
    </div>
</nav>

<div class="feedback-wrapper">
    <div class="feedback-card">
        
        <div class="feedback-header">
            <div class="icon-box">
                <i class="fa-regular fa-comments"></i>
            </div>
            <h2>We Value Your Feedback</h2>
            <p>Tell us how we can improve your experience.</p>
        </div>

        <form id="feedbackForm" method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>Full Name</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" name="name" placeholder="Enter your full name" required>
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" name="email" placeholder="you@example.com">
                </div>
            </div>

            <div class="form-group">
                <label>Your Message</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-pen-nib"></i>
                    <textarea name="message" placeholder="Write your thoughts here..." required></textarea>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span>Send Feedback</span>
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>

    </div>
</div>

<script>
    document.getElementById('feedbackForm').addEventListener('submit', function(event) {
        event.preventDefault(); // Stop instant submission to show animation

        const btn = document.getElementById('submitBtn');
        const form = this;

        // 1. Change to Loading State
        btn.classList.add('is-loading');
        btn.innerHTML = '<span>Sending...</span><i class="fa-solid fa-spinner fa-spin"></i>';

        // 2. Wait 1.2 seconds to simulate network delay
        setTimeout(() => {
            
            // 3. Change to Success State
            btn.classList.remove('is-loading');
            btn.classList.add('is-success');
            btn.innerHTML = '<span>Sent Successfully!</span><i class="fa-solid fa-circle-check"></i>';

            // 4. Actually submit the form to the Django backend after letting the user see the success checkmark
            setTimeout(() => {
                form.submit();
            }, 800); 

        }, 1200);
    });
</script>

</body>
</html>
