<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | ElectroMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold:#b38b4d; --dark:#1a1c20; --bg:#fdfcf9; --red:#e11d48; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; }
        body { background:var(--bg); padding:100px 5% 60px; color:var(--dark); }
        .header-nav { position:fixed; top:0; left:0; width:100%; z-index:1000; background:rgba(253,252,249,0.96); backdrop-filter:blur(15px); height:75px; display:flex; align-items:center; padding:0 5%; justify-content:space-between; box-shadow:0 2px 20px rgba(0,0,0,0.06); }
        .nav-logo-img { height:50px; }
        .nav-links { display:flex; gap:20px; align-items:center; }
        .nav-links a { text-decoration:none; color:var(--dark); font-weight:600; font-size:14px; transition:.3s; }
        .nav-links a:hover { color:var(--gold); }
        .logout-btn { background:var(--dark)!important; color:#fff!important; padding:9px 22px; border-radius:9px; }

        .wrapper { max-width:500px; margin:auto; text-align:center; padding-top:40px; }
        .icon-circle { width:100px; height:100px; border-radius:50%; background:var(--red); display:flex; align-items:center; justify-content:center; margin:0 auto 25px; font-size:2.5rem; color:#fff; box-shadow:0 15px 35px rgba(225,29,72,.3); animation:popIn .6s cubic-bezier(0.175,0.885,0.32,1.275); }
        @keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
        h1 { font-family:'Playfair Display',serif; font-size:2.2rem; margin-bottom:12px; }
        p { color:#6b7280; font-size:15px; line-height:1.7; margin-bottom:35px; }
        .btn { display:inline-flex; align-items:center; gap:8px; padding:13px 30px; background:var(--dark); color:#fff; text-decoration:none; border-radius:12px; font-weight:700; transition:.3s; margin:5px; }
        .btn:hover { background:var(--gold); }
        .btn-outline { background:#fff; color:var(--dark); border:2px solid var(--dark); }
        .btn-outline:hover { background:var(--dark); color:#fff; }
    </style>
</head>
<body>
<nav class="header-nav">
    <a href="/"><img src="/static/logo.jpeg" class="nav-logo-img" alt="Logo"></a>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/product/" style="color:var(--gold)">Products</a>
        <a href="/product/my-orders/" style="color:var(--gold)">My Orders</a>
        <a href="/logout/" class="logout-btn">Logout</a>
    </div>
</nav>

<div class="wrapper">
    <div class="icon-circle"><i class="fas fa-exclamation-triangle"></i></div>
    <h1>Action Not Allowed</h1>
    <p>{{ message }}</p>
    <div>
        <a href="/product/my-orders/" class="btn"><i class="fas fa-list"></i> My Orders</a>
        <a href="/product/" class="btn btn-outline"><i class="fas fa-shopping-bag"></i> Browse Products</a>
    </div>
</div>
</body>
</html>
