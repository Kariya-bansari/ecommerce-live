<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ action }} Successful | Dhara Enterprise</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:"Plus Jakarta Sans",sans-serif; }
        body { background:#fdfcf9; color:#0f172a; padding-top:100px; padding-bottom:80px; display:flex; align-items:flex-start; justify-content:center; }
        .card { background:white; border-radius:24px; border:1px solid #e2e8f0; padding:50px 40px; max-width:500px; width:90%; text-align:center; box-shadow:0 8px 40px rgba(0,0,0,0.06); }
        .icon { font-size:4rem; margin-bottom:20px; }
        h2 { font-size:1.8rem; margin-bottom:12px; }
        p { color:#64748b; font-size:1rem; line-height:1.6; margin-bottom:32px; }
        .order-badge { background:#f8fafc; border-radius:12px; padding:14px; margin-bottom:32px; font-size:0.9rem; color:#64748b; }
        .order-badge strong { color:#0f172a; font-size:1.05rem; }
        .btn { display:inline-flex; align-items:center; gap:8px; padding:14px 28px; border-radius:12px; font-size:15px; font-weight:700; text-decoration:none; transition:.3s; margin:6px; }
        .btn-primary { background:#0f172a; color:white; }
        .btn-primary:hover { background:#1e293b; transform:translateY(-2px); }
        .btn-shop { background:#f97316; color:white; }
        .btn-shop:hover { background:#ea6c0a; transform:translateY(-2px); }
    </style>
</head>
<body>
    {% include "header.html" %}
    <div class="card">
        <div class="icon"><i class="fa-solid {{ icon }}" style="color:{{ color }};"></i></div>
        <h2>{{ action }} Successful!</h2>
        <p>{{ message }}</p>
        <div class="order-badge">Order <strong>#{{ order.id }}</strong> has been {{ action|lower }}.</div>
        <div>
            <a href="/product/orders/" class="btn btn-primary"><i class="fa-solid fa-list"></i> My Orders</a>
            <a href="/product/" class="btn btn-shop"><i class="fa-solid fa-bag-shopping"></i> Shop More</a>
        </div>
    </div>
</body>
</html>
