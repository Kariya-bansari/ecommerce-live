<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order | ElectroMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-bg: #fdfcf9; --accent-gold: #b38b4d; --deep-slate: #1a1c20; --text-muted: #7a7a7a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--primary-bg); padding: 100px 5% 60px; color: var(--deep-slate); }

        .header-nav {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background: rgba(253,252,249,0.95); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(0,0,0,0.05); height: 80px;
            display: flex; align-items: center; padding: 0 5%;
            justify-content: space-between; box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .nav-logo-img { height: 55px; }
        .nav-back { text-decoration: none; color: var(--deep-slate); font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
        .nav-back:hover { color: var(--accent-gold); }

        .container { max-width: 900px; margin: auto; }
        h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 40px; }

        .order-layout { display: grid; grid-template-columns: 1fr 320px; gap: 30px; }
        @media (max-width: 768px) { .order-layout { grid-template-columns: 1fr; } }

        /* FORM */
        .form-card { background: white; border-radius: 20px; padding: 35px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .form-card h3 { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }
        input, textarea, select {
            width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb;
            border-radius: 10px; font-size: 15px; transition: all 0.3s; outline: none;
            font-family: inherit; color: var(--deep-slate);
        }
        input:focus, textarea:focus, select:focus { border-color: var(--accent-gold); box-shadow: 0 0 0 3px rgba(179,139,77,0.1); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }

        /* PRODUCT SUMMARY */
        .product-summary { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); position: sticky; top: 100px; }
        .product-summary img { width: 100%; border-radius: 12px; background: #f5f5f5; padding: 15px; object-fit: contain; height: 200px; margin-bottom: 20px; }
        .prod-brand { font-size: 11px; letter-spacing: 2px; color: var(--accent-gold); font-weight: 800; text-transform: uppercase; }
        .prod-name { font-family: 'Playfair Display', serif; font-size: 1.2rem; margin: 8px 0; }
        .prod-price { font-size: 1.8rem; font-weight: 800; margin: 10px 0; }
        .qty-row { display: flex; align-items: center; gap: 12px; margin: 15px 0; }
        .qty-row label { margin: 0; }
        .qty-input { width: 70px; padding: 8px 12px; text-align: center; }
        .total-row { border-top: 2px solid #f0f0f0; padding-top: 15px; margin-top: 10px; font-weight: 700; font-size: 1.1rem; display: flex; justify-content: space-between; }

        .submit-btn {
            width: 100%; padding: 16px; background: var(--accent-gold); color: white;
            border: none; border-radius: 12px; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: all 0.3s; margin-top: 20px; font-family: inherit;
        }
        .submit-btn:hover { background: #9c7437; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(179,139,77,0.3); }
    </style>
</head>
<body>

{% include "header.html" %}

<div class="container">
    <h1>Place Your Order</h1>

    <form method="POST" action="{% url 'place_order' %}">
        {% csrf_token %}
        <input type="hidden" name="product_id" value="{{ product.id }}">

        <div class="order-layout">
            <!-- SHIPPING FORM -->
            <div class="form-card">
                <h3>Shipping Details</h3>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="full_name" value="{{ request.user.get_full_name }}" required placeholder="Your full name">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" value="{{ request.user.email }}" required>
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" name="phone" required placeholder="+91 XXXXX XXXXX">
                    </div>
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <textarea name="address" rows="3" required placeholder="House No., Street, Area..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" name="city" required placeholder="City">
                    </div>
                    <div class="form-group">
                        <label>Pincode</label>
                        <input type="text" name="pincode" required placeholder="Pincode" maxlength="6">
                    </div>
                </div>
                <div class="form-group">
                    <label>Payment Method</label>
                    <select name="payment_mode" required>
                        <option value="COD">Cash on Delivery</option>
                        <option value="UPI">UPI</option>
                        <option value="CARD">Credit / Debit Card</option>
                        <option value="NETBANKING">Net Banking</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn">
                    <i class="fas fa-check-circle"></i> Confirm Order
                </button>
            </div>

            <!-- PRODUCT SUMMARY -->
            <div class="product-summary">
                {% if product.ProductImage %}
                    <img src="{{ product.ProductImage.url }}" alt="{{ product.Product_Name }}">
                {% else %}
                    <img src="https://via.placeholder.com/300x200?text=No+Image" alt="No Image">
                {% endif %}
                <div class="prod-brand">{{ product.Brand|default:"Exclusive" }}</div>
                <div class="prod-name">{{ product.Product_Name }}</div>
                <div class="prod-price">₹ {{ product.Unit_Price }}</div>
                <div class="qty-row">
                    <label>Qty:</label>
                    <input type="number" name="quantity" class="qty-input" value="1" min="1" max="{{ product.Stock }}" id="qty-input" onchange="updateTotal()">
                </div>
                <div class="total-row">
                    <span>Total</span>
                    <span id="order-total">₹ {{ product.Unit_Price }}</span>
                </div>
            </div>
        </div>
    </form>
</div>

<script>
    const unitPrice = {{ product.Unit_Price }};
    function updateTotal() {
        const qty = parseInt(document.getElementById('qty-input').value) || 1;
        const total = (unitPrice * qty).toFixed(2);
        document.getElementById('order-total').textContent = '₹ ' + total;
    }
</script>
</body>
</html>
