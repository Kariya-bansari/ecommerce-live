<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | ElectroMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #6e8efb;
            --secondary-color: #a777e3;
            --error-color: #ff4d4d;
            --success-color: #2ecc71;
            --text-dark: #333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: linear-gradient(135deg, #24243e, #302b63, #0f0c29);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated blobs */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            filter: blur(80px);
            z-index: 0;
            animation: move 10s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
        }
        .circle-1 { width: 300px; height: 300px; top: -10%; left: -10%; }
        .circle-2 { width: 400px; height: 400px; bottom: -10%; right: -10%; animation-delay: -5s; }
        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(50px, 50px) scale(1.1); }
        }

        /* SUCCESS OVERLAY */
        .success-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: all 0.5s ease;
        }
        .success-overlay.show { visibility: visible; opacity: 1; }

        .checkmark-circle {
            width: 100px; height: 100px;
            border-radius: 50%;
            background: var(--success-color);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 50px;
            transform: scale(0);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .success-overlay.show .checkmark-circle { transform: scale(1); }

        .success-overlay h2 { margin-top: 20px; color: var(--text-dark); font-size: 26px; }
        .success-overlay p  { color: #666; margin-top: 8px; font-size: 15px; }

        .success-btn {
            width: 220px; margin-top: 30px; padding: 14px;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease;
        }
        .success-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

        /* FORM CARD */
        .container {
            width: 100%; max-width: 450px;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px; border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            position: relative; z-index: 1;
            animation: fadeInUp 0.8s ease-out;
            backdrop-filter: blur(10px);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%       { transform: translateX(-10px); }
            75%       { transform: translateX(10px); }
        }
        .shake { animation: shake 0.4s ease-in-out; }

        h2 { text-align: center; color: var(--text-dark); margin-bottom: 25px; font-size: 28px; font-weight: 600; }

        /* SERVER ERROR BANNER */
        .server-error {
            background: #ffebee; color: var(--error-color);
            padding: 12px 16px; border-radius: 10px;
            text-align: center; margin-bottom: 20px;
            font-size: 13px; border: 1px solid #ffcdd2;
            display: flex; align-items: center; gap: 8px; justify-content: center;
        }

        .input-group { margin-bottom: 18px; position: relative; }
        .input-group i.icon { position: absolute; left: 15px; top: 40px; color: #999; transition: all 0.3s; }

        label { display: block; margin-bottom: 8px; color: #555; font-size: 14px; font-weight: 500; }
        input {
            width: 100%; padding: 12px 15px 12px 45px;
            border: 2px solid #eee; border-radius: 12px;
            font-size: 15px; transition: all 0.3s ease;
            outline: none; background: #fdfdfd; font-family: inherit;
        }
        input:focus { border-color: var(--primary-color); box-shadow: 0 0 15px rgba(110, 142, 251, 0.15); background: #fff; }

        .password-wrapper { position: relative; }
        .toggle-pw {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: #999; font-size: 15px;
            background: none; border: none; padding: 0;
        }
        .toggle-pw:hover { color: var(--primary-color); }

        .error-message { color: var(--error-color); font-size: 12px; margin-top: 5px; display: none; font-weight: 500; }

        .strength-bar {
            height: 4px; border-radius: 4px; margin-top: 6px;
            background: #eee; overflow: hidden;
        }
        .strength-fill { height: 100%; width: 0; border-radius: 4px; transition: all 0.3s; }
        .strength-label { font-size: 11px; margin-top: 3px; color: #999; }

        button[type="submit"] {
            width: 100%; padding: 14px; margin-top: 10px;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(110, 142, 251, 0.3);
        }
        button[type="submit"]:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .footer-text { text-align: center; margin-top: 20px; font-size: 14px; color: #777; }
        .footer-text a { color: var(--primary-color); text-decoration: none; font-weight: 600; }
        .footer-text a:hover { color: var(--secondary-color); }
    </style>
</head>
<body>

<!-- SUCCESS OVERLAY (shown when registration succeeds) -->
<div id="successOverlay" class="success-overlay">
    <div class="checkmark-circle"><i class="fas fa-check"></i></div>
    <h2>Registration Successful!</h2>
    <p>Your account has been created. Welcome aboard! 🎉</p>
    <button class="success-btn" onclick="window.location.href='/login/'">Continue to Login</button>
</div>

<div class="circle circle-1"></div>
<div class="circle circle-2"></div>

<div class="container" id="formContainer">
    <h2>Create Account</h2>

    <!-- Server-side error (username taken, email exists, etc.) -->
    {% if msg and "Successful" not in msg %}
    <div class="server-error">
        <i class="fas fa-exclamation-circle"></i>
        {{ msg }}
    </div>
    {% endif %}

    <form id="regForm" method="POST" onsubmit="return validateForm()">
        {% csrf_token %}

        <div class="input-group">
            <label>Username</label>
            <i class="fas fa-user icon"></i>
            <input type="text" name="username" id="username"
                   placeholder="Choose a username"
                   value="{{ request.POST.username|default:'' }}"
                   required minlength="3" maxlength="30"
                   autocomplete="username">
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <i class="fas fa-envelope icon"></i>
            <input type="email" name="email" id="email"
                   placeholder="example@mail.com"
                   value="{{ request.POST.email|default:'' }}"
                   required autocomplete="email">
        </div>

        <div class="input-group">
            <label>Password</label>
            <i class="fas fa-lock icon"></i>
            <div class="password-wrapper">
                <input type="password" name="password" id="password"
                       placeholder="Min 6 characters" required minlength="6"
                       autocomplete="new-password" oninput="checkStrength(this.value)">
                <button type="button" class="toggle-pw" onclick="togglePw('password', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
            <div class="strength-label" id="strengthLabel"></div>
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            <i class="fas fa-shield-alt icon"></i>
            <div class="password-wrapper">
                <input type="password" name="confirm_password" id="confirm_password"
                       placeholder="Repeat password" required
                       autocomplete="new-password" oninput="checkMatch()">
                <button type="button" class="toggle-pw" onclick="togglePw('confirm_password', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <p id="error-msg" class="error-message"><i class="fas fa-times-circle"></i> Passwords do not match!</p>
        </div>

        <button type="submit" id="submitBtn">
            <i class="fas fa-user-plus"></i> Register Now
        </button>
    </form>

    <p class="footer-text">Already have an account? <a href="/login/">Login</a></p>
</div>

<script>
    // --- Auto-show success overlay if server returns success message ---
    window.addEventListener('DOMContentLoaded', function () {
        const msg = "{{ msg|default:''|escapejs }}";
        if (msg && msg.includes("Successful")) {
            document.getElementById('successOverlay').classList.add('show');
        }
    });

    // --- Toggle password visibility ---
    function togglePw(fieldId, btn) {
        const input = document.getElementById(fieldId);
        const icon  = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fas fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fas fa-eye';
        }
    }

    // --- Password strength meter ---
    function checkStrength(val) {
        const fill  = document.getElementById('strengthFill');
        const label = document.getElementById('strengthLabel');
        let score = 0;
        if (val.length >= 6)                score++;
        if (val.length >= 10)               score++;
        if (/[A-Z]/.test(val))              score++;
        if (/[0-9]/.test(val))              score++;
        if (/[^A-Za-z0-9]/.test(val))       score++;

        const levels = [
            { pct: '0%',   color: '#eee',          text: '' },
            { pct: '25%',  color: '#ff4d4d',        text: 'Weak' },
            { pct: '50%',  color: '#ffa500',        text: 'Fair' },
            { pct: '75%',  color: '#6e8efb',        text: 'Good' },
            { pct: '100%', color: '#2ecc71',        text: 'Strong 🔒' },
        ];
        const lvl = levels[Math.min(score, 4)];
        fill.style.width     = lvl.pct;
        fill.style.background = lvl.color;
        label.textContent    = lvl.text;
        label.style.color    = lvl.color;
    }

    // --- Real-time confirm match ---
    function checkMatch() {
        const pw  = document.getElementById('password').value;
        const cpw = document.getElementById('confirm_password');
        const err = document.getElementById('error-msg');
        if (cpw.value.length > 0 && pw !== cpw.value) {
            err.style.display = 'block';
            cpw.style.borderColor = 'var(--error-color)';
        } else {
            err.style.display = 'none';
            cpw.style.borderColor = cpw.value ? 'var(--success-color)' : '#eee';
        }
    }

    // --- Submit validation (shake on mismatch) ---
    function validateForm() {
        const pw  = document.getElementById('password').value;
        const cpw = document.getElementById('confirm_password').value;
        if (pw !== cpw) {
            const container = document.getElementById('formContainer');
            container.classList.remove('shake');
            void container.offsetWidth; // force reflow
            container.classList.add('shake');
            document.getElementById('error-msg').style.display = 'block';
            return false;
        }
        // Show loading state
        const btn = document.getElementById('submitBtn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';
        btn.disabled = true;
        return true;
    }
</script>

</body>
</html>
